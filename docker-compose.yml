# Local/UAT stack: PostgreSQL + API + web. Secrets come from .env (copy .env.example); never commit .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ess
      POSTGRES_USER: ess_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ess_app -d ess"], interval: 5s, retries: 10 }

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ESS_ENVIRONMENT:-Production}
      ConnectionStrings__Ess: Host=db;Database=ess;Username=ess_app;Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set in .env}
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-false}
      Bootstrap__AdminUserName: ${BOOTSTRAP_ADMIN_USER:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes: [ "dpkeys:/home/app/.aspnet/DataProtection-Keys", "files:/data/files" ]
    depends_on: { db: { condition: service_healthy } }

  web:
    build: ./frontend
    ports: [ "8080:80" ]
    depends_on: [ api ]

volumes:
  pgdata:
  dpkeys:
  files:
