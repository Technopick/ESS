name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install PDF fonts
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Check for vulnerable packages
        working-directory: backend
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then echo "::error::Vulnerable NuGet packages found"; exit 1; fi
      - name: Test
        working-directory: backend
        env:
          ESS_TEST_DB: Host=localhost;Username=postgres;Password=postgres;Database=postgres
        run: dotnet test --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Check production dependencies for vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  windows-package:
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the deployment scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem deploy/windows -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Build the IIS package
        shell: pwsh
        run: ./deploy/windows/Build-EssPackage.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ess-portal-win-x64
          path: |
            out/*.zip
            out/*.exe
            out/*.sha256
          retention-days: 30
